<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#cdd9e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zeiterfassung">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Zeiterfassung mit Tages- und Wochenübersicht, Zeitkonto und Urlaub">
<meta property="og:type" content="website">
<meta property="og:title" content="Zeiterfassung">
<meta property="og:description" content="Zeiterfassung mit Tages- und Wochenübersicht, Zeitkonto und Urlaub">
<meta property="og:locale" content="de_DE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Zeiterfassung</title>
<style>
  :root {
    --bg: #cdd9e5;          /* helles Taubenblau */
    --surface: #f7f9fb;
    --ink: #000000;
    --muted: #3b4650;
    --line: #aebccb;
    --accent: #2f4a63;
    --accent-ink: #ffffff;
    --warn: #a63d2f;
    --field: #e3e3e3;       /* helles Grau */
    --field-ink: #c00000;   /* rote Schrift */
    --green: #1e7a34;
    --gold: #f0a500;        /* Mangogelb */
    --feld-h: 32px;         /* Höhe der Eingabefelder */
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.45 Georgia, "Times New Roman", Times, serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  main { max-width: 720px; margin: 0 auto; padding: 10px; }
  header { margin-bottom: 8px; }
  .today { font-size: 1.35rem; font-weight: 700; color: #000; line-height: 1.25; }
  .kw { color: #000; font-size: .95rem; }
  section {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
  }
  h2 { font-size: 1rem; margin: 0 0 6px; }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 2px; line-height: 1.2; }
  input {
    width: 100%;
    font: inherit;
    font-size: 1rem; /* 16 px verhindert Zoom auf dem iPhone */
    height: var(--feld-h);
    padding: 0 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--field);
    color: var(--field-ink);
  }
  input::placeholder { color: #c00000; opacity: .55; }
  input:focus-visible, button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 1px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    padding: 4px 10px;
    font-size: .9rem;
  }
  button.primary {
    width: 100%;
    margin-top: 6px;
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
    font-weight: 600;
    padding: 7px;
    font-size: 1rem;
  }
  .lblrow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; min-height: 22px; }
  .lblrow label { margin: 0; white-space: nowrap; }
  .lblrow button { padding: 0 8px; font-size: .75rem; line-height: 1.5; }
  .error { color: var(--warn); margin: 4px 0 0; font-size: .85rem; }
  .error:empty { display: none; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .95rem; }
  th, td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { font-weight: 600; font-size: .8rem; color: var(--muted); }
  tfoot td { font-weight: 700; border-bottom: none; border-top: 2px solid var(--line); }
  .scroll { overflow-x: auto; }
  .empty { color: var(--muted); margin: 0; }
  .entries { list-style: none; margin: 6px 0 0; padding: 0; }
  .entries li {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 3px 0; border-top: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .entries button { padding: 2px 8px; font-size: .8rem; color: var(--warn); }
  .weeknav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .weeknav h2 { margin: 0; }
  .weeknav div { display: flex; gap: 4px; }
  .weeknav button { padding: 3px 10px; }
  .sub { color: var(--muted); font-size: .8rem; margin: 0 0 6px; line-height: 1.3; }
  tbody tr, .entries li { font-weight: 600; }
  tbody tr:nth-child(odd), .entries li:nth-child(odd) { color: var(--green); }
  tbody tr:nth-child(even), .entries li:nth-child(even) { color: var(--gold); }
  .datefield { margin-bottom: 6px; }
  input[type="date"], input[type="time"] { min-height: var(--feld-h); text-align: left; -webkit-appearance: none; appearance: none; }
  .zeitbtn { padding: 2px 8px; font-size: .8rem; margin-top: 0; }
  #datum, #datum::-webkit-datetime-edit, #datum::-webkit-datetime-edit-fields-wrapper,
  #datum::-webkit-datetime-edit-day-field, #datum::-webkit-datetime-edit-month-field,
  #datum::-webkit-datetime-edit-year-field, #datum::-webkit-datetime-edit-text {
    color: var(--gold);
    font-weight: 600;
  }
  .check { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: .9rem; color: var(--ink); }
  .check input { width: 20px; height: 20px; padding: 0; margin: 0; flex: none; accent-color: var(--accent); }
  .wochebox { position: relative; min-height: 110px; }
  .stempel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .stempel svg { height: 100%; max-height: 320px; width: auto; max-width: 100%; }
  .kout { background: transparent; color: var(--ink); font-weight: 700; cursor: default; }
  .kout.neg { color: var(--warn); }
  .kinfo { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 6px; }
  .kinfo .sub { margin: 0; }
  .kinfo button { flex: none; padding: 2px 8px; font-size: .8rem; }
  input:disabled { opacity: .55; }
  .urlaubrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 4px; }
  .urlaubrow label { margin: 0; font-size: .9rem; color: var(--ink); }
  .urlaubrow input { width: 90px; text-align: right; }
  #urlaubInfo:empty { display: none; }
  .sichern { text-align: center; padding: 0 0 6px; }
  .sbtns { display: flex; gap: 10px; justify-content: center; }
  .sbtns button { padding: 3px 14px; font-size: .85rem; }
  .sichern .sub { margin: 6px 0 0; }
  .sichern .sub:empty { display: none; }
  [hidden] { display: none !important; }
  #abbrechen { width: 100%; margin-top: 6px; }
  .entries .btns { display: flex; gap: 6px; }
  .entries button[data-edit] { color: var(--ink); }
  #woche th:first-child, #woche td:first-child {
    position: sticky;
    left: 0;
    z-index: 1;
    background: var(--surface);
    box-shadow: 1px 0 0 var(--line);
  }
  th[data-date] { cursor: pointer; }
  th.sel { box-shadow: inset 0 -3px 0 var(--accent); }
  .hl { background: color-mix(in srgb, var(--accent) 14%, transparent); }
</style>
</head>
<body>
<main>
  <header>
    <div class="today" id="today"></div>
    <div class="kw" id="kw"></div>
  </header>

  <section aria-labelledby="h-erfassen">
    <h2 id="h-erfassen">Zeit erfassen</h2>
    <div class="datefield">
      <label for="datum">Datum</label>
      <input id="datum" type="date">
    </div>
    <div class="row">
      <label class="check"><input type="checkbox" id="cUrlaub"> Urlaub (8 Std)</label>
      <label class="check"><input type="checkbox" id="cKrank"> Krank (8 Std)</label>
    </div>
    <div class="row">
      <div>
        <div class="lblrow"><label for="auftrag">Betriebsauftrag</label><button type="button" id="modus" aria-label="Zur Buchstabentastatur wechseln">ABC</button></div>
        <input id="auftrag" type="text" maxlength="10" autocomplete="off" spellcheck="false" inputmode="numeric" pattern="[0-9]*" enterkeyhint="next">
      </div>
      <div>
        <div class="lblrow"><label for="zeit">Zeit (dezimal)</label></div>
        <input id="zeit" type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" autocomplete="off" placeholder="z. B. 1,5" enterkeyhint="done">
      </div>
    </div>
    <button class="primary" id="speichern" type="button">Speichern</button>
    <button id="abbrechen" type="button" hidden>Abbrechen</button>
    <p class="error" id="fehler" role="alert"></p>
  </section>

  <section aria-labelledby="h-tag">
    <div class="weeknav">
      <h2 id="h-tag">Heute</h2>
      <div>
        <button type="button" id="dprev" aria-label="Vorheriger Tag">‹</button>
        <button type="button" id="dcur">Heute</button>
        <button type="button" id="dnext" aria-label="Nächster Tag">›</button>
      </div>
    </div>
    <div class="row">
      <div>
        <label for="tvon">Beginn (6:00–18:00 Uhr)</label>
        <input id="tvon" type="time" min="06:00" max="18:00" step="60">
      </div>
      <div>
        <label for="tbis">Ende (6:00–18:00 Uhr)</label>
        <input id="tbis" type="time" min="06:00" max="18:00" step="60">
      </div>
    </div>
    <div class="kinfo"><p class="sub" id="zeitInfo" role="status"></p><button type="button" class="zeitbtn" id="zeitDel" hidden>Löschen</button></div>
    <div id="tag"></div>
  </section>

  <section aria-labelledby="h-woche">
    <div class="weeknav">
      <h2 id="h-woche">Woche</h2>
      <div>
        <button type="button" id="prev" aria-label="Vorherige Woche">‹</button>
        <button type="button" id="cur">Aktuell</button>
        <button type="button" id="next" aria-label="Nächste Woche">›</button>
      </div>
    </div>
    <p class="sub" id="wochenInfo"></p>
    <div class="row">
      <div>
        <div class="lblrow"><label for="kAnfang">Stand Beginn</label><button type="button" id="kSign" aria-label="Vorzeichen wechseln">±</button></div>
        <input id="kAnfang" type="text" inputmode="decimal" autocomplete="off" placeholder="–">
      </div>
      <div>
        <div class="lblrow"><label for="kEnde">Stand Ende</label></div>
        <input id="kEnde" class="kout" type="text" readonly tabindex="-1" inputmode="none" value="–">
      </div>
    </div>
    <div class="kinfo"><p class="sub" id="kontoInfo"></p><button type="button" id="kReset" hidden>Automatisch</button></div>
    <div class="urlaubrow">
      <label for="urlaub">Urlaubstage (Rest)</label>
      <input id="urlaub" type="text" inputmode="decimal" autocomplete="off" placeholder="–">
    </div>
    <p class="sub" id="urlaubInfo" role="status"></p>
    <label class="check"><input type="checkbox" id="wocheFertig"> Woche als eingegeben markieren</label>
    <div class="wochebox">
      <div class="scroll" id="woche"></div>
      <div class="stempel" id="stempel" hidden aria-hidden="true">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M14 54 L38 78 L88 22" fill="none" stroke="rgba(228,70,70,0.42)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </section>
  <footer class="sichern">
    <div class="sbtns">
      <button type="button" id="exportBtn">Export</button>
      <button type="button" id="importBtn">Import</button>
    </div>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
    <p class="sub" id="sichStatus" role="status"></p>
  </footer>
</main>

<script>
(function () {
  var KEY = "zeiterfassung.v1";
  var TAGE = ["Mo", "Di", "Mi", "Do", "Fr"];
  var selected = dayKey(new Date());
  var editingId = null;
  var lastDay = null;

  /* ---------- Speicher ---------- */
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
  }
  function save(list) {
    try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
  }

  var SOLL = 8;
  var CKEY = "zeiterfassung.konto.v1";
  function loadKonto() {
    try { return JSON.parse(localStorage.getItem(CKEY)) || null; } catch (e) { return null; }
  }
  function saveKonto(c) {
    try { localStorage.setItem(CKEY, JSON.stringify(c)); } catch (e) {}
  }
  var ZKEY = "zeiterfassung.zeiten.v1";
  var PAUSE = 0.75;
  function loadZeiten() {
    try {
      var o = JSON.parse(localStorage.getItem(ZKEY));
      return (o && typeof o === "object") ? o : {};
    } catch (e) { return {}; }
  }
  function saveZeiten(z) {
    try { localStorage.setItem(ZKEY, JSON.stringify(z)); } catch (e) {}
  }
  function toMin(t) { var p = t.split(":"); return (+p[0]) * 60 + (+p[1]); }
  function workHours(z) {
    if (!z || !z.von || !z.bis) return null;
    var d = toMin(z.bis) - toMin(z.von);
    if (d <= 0) return null;
    return Math.round(Math.max(0, d / 60 - PAUSE) * 100) / 100;
  }
  var REST_AUFTRAG = "8";
  function restZeit(date, booked, times) {
    var wh = workHours(times[date]);
    if (wh === null) return 0;
    var r = Math.round((wh - booked) * 100) / 100;
    return r > 0 ? r : 0;
  }
  var UKEY = "zeiterfassung.urlaub.v1";
  function loadUrlaub() {
    try {
      var o = JSON.parse(localStorage.getItem(UKEY));
      return (o && typeof o.rest === "number" && isFinite(o.rest)) ? o.rest : null;
    } catch (e) { return null; }
  }
  function saveUrlaub(n) {
    try {
      if (n === null) localStorage.removeItem(UKEY);
      else localStorage.setItem(UKEY, JSON.stringify({ rest: n }));
    } catch (e) {}
  }
  function adjustUrlaub(delta) {
    var r = loadUrlaub();
    if (r === null) return;
    saveUrlaub(round2(r + delta));
  }
  var WKEY = "zeiterfassung.wochen.v1";
  function loadWeeks() {
    try { return JSON.parse(localStorage.getItem(WKEY)) || {}; } catch (e) { return {}; }
  }
  function saveWeeks(w) {
    try { localStorage.setItem(WKEY, JSON.stringify(w)); } catch (e) {}
  }

  /* ---------- Datum ---------- */
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function dayKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parseKey(k) {
    var p = k.split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function shiftKey(k, days) {
    var d = parseKey(k);
    d.setDate(d.getDate() + days);
    return dayKey(d);
  }
  function mondayOf(d) {
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var wd = (x.getDay() + 6) % 7; // Mo=0
    x.setDate(x.getDate() - wd);
    return x;
  }
  function isoWeek(d) {
    var x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var dayNum = x.getUTCDay() || 7;
    x.setUTCDate(x.getUTCDate() + 4 - dayNum);
    var yearStart = new Date(Date.UTC(x.getUTCFullYear(), 0, 1));
    return { week: Math.ceil(((x - yearStart) / 86400000 + 1) / 7), year: x.getUTCFullYear() };
  }
  function fmtLong(d) {
    return d.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }
  function fmtDay(d) {
    return d.toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "2-digit", year: "numeric" });
  }
  function fmtShort(d) { return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "."; }

  /* ---------- Zahlen ---------- */
  function fmt(n) {
    return (Math.round(n * 100) / 100).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function parseZeit(s) {
    s = String(s).trim().replace(",", ".");
    if (!/^\d+(\.\d+)?$/.test(s)) return NaN;
    return parseFloat(s);
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------- Elemente ---------- */
  var elToday = document.getElementById("today");
  var elKw = document.getElementById("kw");
  var elTag = document.getElementById("tag");
  var elTagTitle = document.getElementById("h-tag");
  var elWoche = document.getElementById("woche");
  var elInfo = document.getElementById("wochenInfo");
  var elFehler = document.getElementById("fehler");
  var elDatum = document.getElementById("datum");
  var auftragEl = document.getElementById("auftrag");
  var zeitEl = document.getElementById("zeit");
  var speichernBtn = document.getElementById("speichern");
  var abbrechenBtn = document.getElementById("abbrechen");
  var formTitle = document.getElementById("h-erfassen");
  var modusBtn = document.getElementById("modus");
  var zahlenModus = true;
  var elKAnfang = document.getElementById("kAnfang");
  var elKReset = document.getElementById("kReset");
  var elKEnde = document.getElementById("kEnde");
  var elKInfo = document.getElementById("kontoInfo");
  var elFertig = document.getElementById("wocheFertig");
  var elStempel = document.getElementById("stempel");
  var elTVon = document.getElementById("tvon");
  var elTBis = document.getElementById("tbis");
  var elZeitInfo = document.getElementById("zeitInfo");
  var elZeitDel = document.getElementById("zeitDel");
  var cUrlaub = document.getElementById("cUrlaub");
  var cKrank = document.getElementById("cKrank");
  var elUrlaub = document.getElementById("urlaub");
  var elUrlaubInfo = document.getElementById("urlaubInfo");
  var exportBtn = document.getElementById("exportBtn");
  var importBtn = document.getElementById("importBtn");
  var importFile = document.getElementById("importFile");
  var elStatus = document.getElementById("sichStatus");

  /* ---------- Darstellung ---------- */
  function renderHeader() {
    var now = new Date();
    elToday.textContent = fmtLong(now);
    elKw.textContent = "Kalenderwoche " + isoWeek(now).week;
    lastDay = dayKey(now);
  }

  function renderTag() {
    var list = load();
    var isToday = selected === dayKey(new Date());
    elTagTitle.textContent = isToday ? "Heute" : fmtDay(parseKey(selected));
    var mine = list.filter(function (e) { return e.date === selected; });
    var booked = 0;
    mine.forEach(function (e) { if (!e.typ) booked += e.stunden; });
    var rest = restZeit(selected, booked, loadZeiten());
    if (!mine.length && !rest) {
      elTag.innerHTML = '<p class="empty">' + (isToday ? "Heute noch keine Zeiten erfasst." : "Für diesen Tag sind keine Zeiten erfasst.") + "</p>";
      return;
    }
    var sums = {}, order = [], total = 0;
    mine.forEach(function (e) {
      if (!(e.auftrag in sums)) { sums[e.auftrag] = 0; order.push(e.auftrag); }
      sums[e.auftrag] += e.stunden;
      total += e.stunden;
    });
    if (rest > 0) {
      if (!(REST_AUFTRAG in sums)) { sums[REST_AUFTRAG] = 0; order.push(REST_AUFTRAG); }
      sums[REST_AUFTRAG] += rest;
      total += rest;
    }
    var h = '<table><thead><tr><th>Betriebsauftrag</th><th>Zeit</th></tr></thead><tbody>';
    order.forEach(function (a) { h += "<tr><td>" + esc(a) + "</td><td>" + fmt(sums[a]) + "</td></tr>"; });
    h += "</tbody><tfoot><tr><td>Summe</td><td>" + fmt(total) + "</td></tr></tfoot></table>";
    if (mine.length) h += '<ul class="entries">';
    mine.forEach(function (e) {
      h += "<li><span>" + esc(e.auftrag) + " · " + fmt(e.stunden) + '</span><span class="btns">' +
        '<button type="button" data-edit="' + e.id + '" aria-label="Eintrag ' + esc(e.auftrag) + ' bearbeiten">Bearbeiten</button>' +
        '<button type="button" data-del="' + e.id + '" aria-label="Eintrag ' + esc(e.auftrag) + ' löschen">Löschen</button></span></li>';
    });
    if (mine.length) h += "</ul>";
    elTag.innerHTML = h;
  }

  function renderWoche() {
    var list = load();
    var base = mondayOf(parseKey(selected));
    var done = !!loadWeeks()[dayKey(base)];
    elFertig.checked = done;
    elStempel.hidden = !done;
    var days = [];
    for (var i = 0; i < 5; i++) {
      days.push(new Date(base.getFullYear(), base.getMonth(), base.getDate() + i));
    }
    var keys = days.map(dayKey);
    var info = isoWeek(days[0]);
    elInfo.textContent = "KW " + info.week + " · " + fmtShort(days[0]) + " – " + fmtShort(days[4]) + days[4].getFullYear() + " · Tippe auf einen Tag, um ihn zu öffnen";

    var rows = {}, order = [], dayTotals = [0, 0, 0, 0, 0], grand = 0, bookedBy = {};
    list.forEach(function (e) {
      var idx = keys.indexOf(e.date);
      if (idx < 0) return;
      if (!e.typ) bookedBy[e.date] = (bookedBy[e.date] || 0) + e.stunden;
      if (!rows[e.auftrag]) { rows[e.auftrag] = [0, 0, 0, 0, 0]; order.push(e.auftrag); }
      rows[e.auftrag][idx] += e.stunden;
      dayTotals[idx] += e.stunden;
      grand += e.stunden;
    });
    var zeitenAll = loadZeiten();
    keys.forEach(function (k, i) {
      var r = restZeit(k, bookedBy[k] || 0, zeitenAll);
      if (r > 0) {
        if (!rows[REST_AUFTRAG]) { rows[REST_AUFTRAG] = [0, 0, 0, 0, 0]; order.push(REST_AUFTRAG); }
        rows[REST_AUFTRAG][i] += r;
        dayTotals[i] += r;
        grand += r;
      }
    });
    var todayKey = dayKey(new Date());
    var head = "<thead><tr><th>Auftrag</th>";
    TAGE.forEach(function (t, i) {
      var cls = (keys[i] === todayKey ? "hl " : "") + (keys[i] === selected ? "sel" : "");
      head += '<th class="' + cls + '" data-date="' + keys[i] + '" title="' + fmtShort(days[i]) + ' öffnen">' + t + "</th>";
    });
    head += "<th>Summe</th></tr></thead>";
    if (!order.length) {
      elWoche.innerHTML = "<table>" + head + '</table><p class="empty" style="margin-top:10px">In dieser Woche gibt es keine Einträge.</p>';
      return;
    }
    var h = "<table>" + head + "<tbody>";
    order.forEach(function (a) {
      var sum = 0;
      h += "<tr><td>" + esc(a) + "</td>";
      rows[a].forEach(function (v, i) {
        sum += v;
        h += '<td class="' + (keys[i] === todayKey ? "hl" : "") + '">' + (v ? fmt(v) : "–") + "</td>";
      });
      h += "<td><strong>" + fmt(sum) + "</strong></td></tr>";
    });
    h += "</tbody><tfoot><tr><td>Summe</td>";
    dayTotals.forEach(function (v) { h += "<td>" + (v ? fmt(v) : "–") + "</td>"; });
    h += "<td>" + fmt(grand) + "</td></tr></tfoot></table>";
    elWoche.innerHTML = h;
  }

  function round2(x) { return Math.round(x * 100) / 100; }
  function fmtS(n) {
    var r = round2(n);
    return (r < 0 ? "\u2212" : (r > 0 ? "+" : "")) + fmt(Math.abs(r)) + " Std";
  }
  function parseSigned(str) {
    var t = String(str).trim().replace("\u2212", "-").replace(",", ".");
    if (!/^[-+]?\d+(\.\d+)?$/.test(t)) return NaN;
    return parseFloat(t);
  }
  function saldoFor(target, cfg) {
    if (target < cfg.startDate) return null;
    var sums = {}, specials = {};
    load().forEach(function (e) {
      if (e.typ) { specials[e.date] = (specials[e.date] || 0) + e.stunden; }
      else { sums[e.date] = (sums[e.date] || 0) + e.stunden; }
    });
    var times = loadZeiten();
    var bal = cfg.startSaldo;
    var d = parseKey(cfg.startDate);
    for (var guard = 0; guard < 20000; guard++) {
      var key = dayKey(d);
      var wd = d.getDay();
      var soll = (wd >= 1 && wd <= 5) ? SOLL : 0;
      var ov = cfg.overrides && Object.prototype.hasOwnProperty.call(cfg.overrides, key);
      var anfang = ov ? round2(cfg.overrides[key]) : round2(bal - soll);
      var wh = workHours(times[key]);
      var credit = (wh !== null ? wh : (sums[key] || 0)) + (specials[key] || 0);
      var ende = round2(anfang + credit);
      bal = ende;
      if (key === target) return { anfang: anfang, ende: ende, soll: soll, overridden: !!ov, viaZeiten: wh !== null };
      d.setDate(d.getDate() + 1);
    }
    return null;
  }
  function numStr(n) { return round2(n).toFixed(2).replace(".", ","); }
  function setKV(el, val) {
    el.value = val === null ? "–" : fmtS(val);
    el.className = "kout" + (val !== null && round2(val) < 0 ? " neg" : "");
  }
  function renderKonto() {
    var cfg = loadKonto();
    var r = (cfg && cfg.startDate) ? saldoFor(selected, cfg) : null;
    if (document.activeElement !== elKAnfang) elKAnfang.value = r ? numStr(r.anfang) : "";
    elKReset.hidden = !(r && r.overridden);
    setKV(elKEnde, r ? r.ende : null);
    if (!cfg || !cfg.startDate) {
      elKInfo.textContent = "Trage links den Stand zu Beginn ein, dann wird ab diesem Tag gerechnet.";
      return;
    }
    if (!r) {
      elKInfo.textContent = "Vor dem " + parseKey(cfg.startDate).toLocaleDateString("de-DE") + " wird nicht gerechnet. Du kannst links trotzdem einen Wert eintragen.";
      return;
    }
    elKInfo.textContent = fmtDay(parseKey(selected)) +
      (r.soll ? " \u00b7 Soll " + SOLL + " Std" : " \u00b7 Wochenende, kein Soll") +
      (r.overridden ? " \u00b7 manuell angepasst" : "") +
      (r.viaZeiten ? " \u00b7 Arbeitszeit aus Beginn/Ende" : "");
  }
  function commitAnfang() {
    var txt = elKAnfang.value.trim();
    var cfg = loadKonto() || {};
    cfg.overrides = cfg.overrides || {};
    if (txt === "") {
      if (!cfg.startDate) { renderKonto(); return; }
      delete cfg.overrides[selected];
      saveKonto(cfg);
      renderKonto();
      return;
    }
    var v = parseSigned(txt);
    if (isNaN(v)) {
      renderKonto();
      elKInfo.textContent = "Bitte den Wert als Dezimalzahl eingeben, z. B. -14,5.";
      return;
    }
    v = round2(v);
    if (!cfg.startDate) {
      cfg.startDate = selected;
      cfg.startSaldo = 0;
    } else if (selected < cfg.startDate) {
      var od = parseKey(cfg.startDate).getDay();
      var oldSoll = (od >= 1 && od <= 5) ? SOLL : 0;
      if (!Object.prototype.hasOwnProperty.call(cfg.overrides, cfg.startDate)) {
        cfg.overrides[cfg.startDate] = round2(cfg.startSaldo - oldSoll);
      }
      cfg.startDate = selected;
      cfg.startSaldo = 0;
    }
    cfg.overrides[selected] = v;
    saveKonto(cfg);
    renderKonto();
  }

  function restStr(n) { return String(n).replace(".", ","); }
  function renderUrlaub() {
    var r = loadUrlaub();
    if (document.activeElement !== elUrlaub) elUrlaub.value = r === null ? "" : restStr(r);
    elUrlaubInfo.textContent = r === null
      ? "Resturlaub eintragen, dann verringert er sich bei jedem Urlaubs-Eintrag automatisch um 1 Tag."
      : "";
  }

  function renderZeiten(force) {
    var z = loadZeiten()[selected] || {};
    if (force || document.activeElement !== elTVon) elTVon.value = z.von || "";
    if (force || document.activeElement !== elTBis) elTBis.value = z.bis || "";
    elZeitDel.hidden = !(z.von || z.bis);
    var wh = workHours(z);
    if (wh !== null) {
      var brutto = (toMin(z.bis) - toMin(z.von)) / 60;
      var bk = 0;
      load().forEach(function (e) { if (e.date === selected && !e.typ) bk += e.stunden; });
      var rz = restZeit(selected, bk, loadZeiten());
      elZeitInfo.textContent = "Arbeitszeit " + fmt(wh) + " Std (" + fmt(brutto) + " Std abzüglich " + fmt(PAUSE) + " Std Pause)" +
        (rz > 0 ? " \u00b7 Auftrag " + REST_AUFTRAG + ": " + fmt(rz) + " Std (automatisch)" : "");
    } else if (z.von && z.bis) {
      elZeitInfo.textContent = "Das Ende muss nach dem Beginn liegen.";
    } else if (z.von || z.bis) {
      elZeitInfo.textContent = "Bitte Beginn und Ende eintragen.";
    } else {
      elZeitInfo.textContent = "Beginn und Ende eintragen, 45 Min Pause werden automatisch abgezogen.";
    }
  }

  function renderAll() {
    renderHeader();
    renderTag();
    renderWoche();
    renderKonto();
    renderUrlaub();
    renderZeiten(false);
    elDatum.value = selected;
  }

  /* ---------- Formular ---------- */
  function applyModus() {
    if (zahlenModus) {
      auftragEl.setAttribute("inputmode", "numeric");
      auftragEl.setAttribute("pattern", "[0-9]*");
      auftragEl.setAttribute("autocapitalize", "off");
      modusBtn.textContent = "ABC";
      modusBtn.setAttribute("aria-label", "Zur Buchstabentastatur wechseln");
    } else {
      auftragEl.setAttribute("inputmode", "text");
      auftragEl.removeAttribute("pattern");
      auftragEl.setAttribute("autocapitalize", "characters");
      modusBtn.textContent = "123";
      modusBtn.setAttribute("aria-label", "Zur Zahlentastatur wechseln");
    }
  }

  function currentTyp() {
    return cUrlaub.checked ? "urlaub" : (cKrank.checked ? "krank" : null);
  }
  function updateTypUI(prevSpecial) {
    var typ = currentTyp();
    var special = !!typ;
    auftragEl.disabled = special;
    zeitEl.disabled = special;
    modusBtn.disabled = special;
    if (special) {
      auftragEl.value = typ === "urlaub" ? "Urlaub" : "Krank";
      zeitEl.value = String(SOLL).replace(".", ",") + ",00";
    } else if (prevSpecial) {
      auftragEl.value = "";
      zeitEl.value = "";
    }
  }

  function resetForm() {
    editingId = null;
    cUrlaub.checked = false;
    cKrank.checked = false;
    updateTypUI(false);
    auftragEl.value = "";
    zeitEl.value = "";
    elFehler.textContent = "";
    speichernBtn.textContent = "Speichern";
    abbrechenBtn.hidden = true;
    formTitle.textContent = "Zeit erfassen";
  }

  function startEdit(id) {
    var entry = load().filter(function (x) { return x.id === id; })[0];
    if (!entry) return;
    editingId = id;
    auftragEl.value = entry.auftrag;
    zeitEl.value = String(entry.stunden).replace(".", ",");
    cUrlaub.checked = entry.typ === "urlaub";
    cKrank.checked = entry.typ === "krank";
    if (!entry.typ) {
      zahlenModus = /^\d+$/.test(entry.auftrag);
      applyModus();
    }
    updateTypUI(false);
    elFehler.textContent = "";
    speichernBtn.textContent = "Änderung speichern";
    abbrechenBtn.hidden = false;
    formTitle.textContent = "Eintrag bearbeiten";
    formTitle.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  /* ---------- Aktionen ---------- */
  speichernBtn.addEventListener("click", function () {
    var typ = currentTyp();
    var datum = /^\d{4}-\d{2}-\d{2}$/.test(elDatum.value) ? elDatum.value : selected;
    var a, z;
    if (typ) {
      var wdTag = parseKey(datum).getDay();
      if (wdTag === 0 || wdTag === 6) {
        elFehler.textContent = "Urlaub und Krank können nur an Werktagen (Mo–Fr) eingetragen werden.";
        return;
      }
      a = typ === "urlaub" ? "Urlaub" : "Krank";
      z = SOLL;
    } else {
      a = auftragEl.value.trim();
      z = parseZeit(zeitEl.value);
      if (!a) { elFehler.textContent = "Bitte einen Betriebsauftrag eingeben (bis zu 10 Zeichen)."; auftragEl.focus(); return; }
      if (isNaN(z) || z <= 0) { elFehler.textContent = "Bitte die Zeit als Dezimalzahl eingeben, z. B. 1,5."; zeitEl.focus(); return; }
      if (z > 24) { elFehler.textContent = "Eine Zeit über 24 Stunden ist nicht möglich."; zeitEl.focus(); return; }
    }
    var list = load();
    if (typ) {
      var dupe = list.some(function (x) { return x.date === datum && x.typ && x.id !== editingId; });
      if (dupe) { elFehler.textContent = "Für diesen Tag ist bereits Urlaub oder Krank eingetragen."; return; }
    }
    var found = false;
    var oldTyp = null;
    if (editingId) {
      list.forEach(function (x) {
        if (x.id === editingId) {
          oldTyp = x.typ || null;
          x.auftrag = a; x.stunden = z; x.date = datum;
          if (typ) { x.typ = typ; } else { delete x.typ; }
          found = true;
        }
      });
    }
    if (!found) {
      var neu = { id: Date.now() + "-" + Math.floor(Math.random() * 1000), date: datum, auftrag: a, stunden: z };
      if (typ) neu.typ = typ;
      list.push(neu);
    }
    var delta = (typ === "urlaub" ? 1 : 0) - (oldTyp === "urlaub" ? 1 : 0);
    if (delta) adjustUrlaub(-delta);
    save(list);
    selected = datum;
    resetForm();
    renderAll();
    if (!typ) auftragEl.focus();
  });

  cUrlaub.addEventListener("change", function () {
    var was = auftragEl.disabled;
    if (cUrlaub.checked) cKrank.checked = false;
    updateTypUI(was);
  });
  cKrank.addEventListener("change", function () {
    var was = auftragEl.disabled;
    if (cKrank.checked) cUrlaub.checked = false;
    updateTypUI(was);
  });

  abbrechenBtn.addEventListener("click", function () { resetForm(); });

  zeitEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") speichernBtn.click();
  });

  elDatum.addEventListener("change", function () {
    if (/^\d{4}-\d{2}-\d{2}$/.test(elDatum.value)) { selected = elDatum.value; renderAll(); }
  });

  elTag.addEventListener("click", function (e) {
    var t = e.target;
    if (!t.getAttribute) return;
    var del = t.getAttribute("data-del");
    var ed = t.getAttribute("data-edit");
    if (del) {
      var all = load();
      var gone = all.filter(function (x) { return x.id === del; })[0];
      if (gone && gone.typ === "urlaub") adjustUrlaub(1);
      save(all.filter(function (x) { return x.id !== del; }));
      if (editingId === del) resetForm();
      renderAll();
    } else if (ed) {
      startEdit(ed);
    }
  });

  elWoche.addEventListener("click", function (e) {
    var th = e.target.closest ? e.target.closest("[data-date]") : null;
    if (!th) return;
    selected = th.getAttribute("data-date");
    renderAll();
    elTagTitle.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  elFertig.addEventListener("change", function () {
    var w = loadWeeks();
    var k = dayKey(mondayOf(parseKey(selected)));
    if (elFertig.checked) { w[k] = true; } else { delete w[k]; }
    saveWeeks(w);
    elStempel.hidden = !elFertig.checked;
  });

  elKAnfang.addEventListener("change", commitAnfang);
  elKAnfang.addEventListener("keydown", function (e) {
    if (e.key === "Enter") elKAnfang.blur();
  });
  document.getElementById("kSign").addEventListener("click", function () {
    var v = elKAnfang.value.trim().replace("−", "-");
    if (!v) return;
    elKAnfang.value = v.charAt(0) === "-" ? v.slice(1) : "-" + v;
    commitAnfang();
  });
  elKReset.addEventListener("click", function () {
    elKAnfang.value = "";
    commitAnfang();
  });

  function today() { return dayKey(new Date()); }
  document.getElementById("dprev").addEventListener("click", function () { selected = shiftKey(selected, -1); renderAll(); });
  document.getElementById("dnext").addEventListener("click", function () { selected = shiftKey(selected, 1); renderAll(); });
  document.getElementById("dcur").addEventListener("click", function () { selected = today(); renderAll(); });
  document.getElementById("prev").addEventListener("click", function () { selected = shiftKey(selected, -7); renderAll(); });
  document.getElementById("next").addEventListener("click", function () { selected = shiftKey(selected, 7); renderAll(); });
  document.getElementById("cur").addEventListener("click", function () { selected = today(); renderAll(); });

  /* ---------- Tastatur-Umschalter Betriebsauftrag ---------- */
  modusBtn.addEventListener("click", function () {
    zahlenModus = !zahlenModus;
    applyModus();
    auftragEl.blur();
    setTimeout(function () { auftragEl.focus(); }, 50);
  });

  /* ---------- Beginn / Ende ---------- */
  function inRange(t) { return !t || (t >= "06:00" && t <= "18:00"); }
  function onZeitChange() {
    var v = elTVon.value, b = elTBis.value;
    if (!inRange(v) || !inRange(b)) {
      elZeitInfo.textContent = "Bitte eine Zeit zwischen 06:00 und 18:00 Uhr wählen.";
      return;
    }
    var all = loadZeiten();
    if (!v && !b) { delete all[selected]; } else { all[selected] = { von: v, bis: b }; }
    saveZeiten(all);
    renderAll();
  }
  function onZeitBlur() {
    var bad = !inRange(elTVon.value) || !inRange(elTBis.value);
    renderZeiten(true);
    if (bad) elZeitInfo.textContent = "Bitte eine Zeit zwischen 06:00 und 18:00 Uhr wählen.";
  }
  elTVon.addEventListener("change", onZeitChange);
  elTBis.addEventListener("change", onZeitChange);
  elTVon.addEventListener("blur", onZeitBlur);
  elTBis.addEventListener("blur", onZeitBlur);
  elZeitDel.addEventListener("click", function () {
    var all = loadZeiten();
    delete all[selected];
    saveZeiten(all);
    renderZeiten(true);
    renderAll();
  });

  /* ---------- Urlaubstage ---------- */
  elUrlaub.addEventListener("change", function () {
    var t = elUrlaub.value.trim();
    if (t === "") {
      saveUrlaub(null);
    } else {
      var v = parseZeit(t);
      if (isNaN(v)) {
        renderUrlaub();
        elUrlaubInfo.textContent = "Bitte die Urlaubstage als Zahl eingeben, z. B. 24 oder 12,5.";
        return;
      }
      saveUrlaub(round2(v));
    }
    renderUrlaub();
  });
  elUrlaub.addEventListener("keydown", function (e) {
    if (e.key === "Enter") elUrlaub.blur();
  });

  /* ---------- Sicherung: Export / Import ---------- */
  function setStatus(msg) { elStatus.textContent = msg; }
  function isTime(t) { return typeof t === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(t); }
  function isKey(k) { return typeof k === "string" && /^\d{4}-\d{2}-\d{2}$/.test(k); }

  function buildBackup() {
    return {
      app: "zeiterfassung",
      version: 1,
      exportiert: new Date().toISOString(),
      eintraege: load(),
      wochen: loadWeeks(),
      konto: loadKonto(),
      zeiten: loadZeiten(),
      urlaubRest: loadUrlaub()
    };
  }

  function downloadBackup(json, name) {
    var blob = new Blob([json], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    setStatus("Sicherung \u201e" + name + "\u201c wurde erstellt.");
  }

  exportBtn.addEventListener("click", function () {
    var json = JSON.stringify(buildBackup(), null, 1);
    var name = "zeiterfassung-" + today() + ".json";
    var file = null;
    try { file = new File([json], name, { type: "application/json" }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: "Zeiterfassung Sicherung" }).then(function () {
        setStatus("Sicherung wurde weitergegeben.");
      }).catch(function (err) {
        if (err && err.name === "AbortError") { setStatus("Export abgebrochen."); }
        else { downloadBackup(json, name); }
      });
    } else {
      downloadBackup(json, name);
    }
  });

  function sanitizeBackup(o) {
    if (!o || typeof o !== "object" || o.app !== "zeiterfassung" || !Array.isArray(o.eintraege)) return null;
    var seen = {}, out = [], skipped = 0;
    o.eintraege.forEach(function (x) {
      var st = x ? Number(x.stunden) : NaN;
      if (!x || !isKey(x.date) || typeof x.auftrag !== "string" || !x.auftrag.trim() || !isFinite(st) || st <= 0 || st > 24) {
        skipped++;
        return;
      }
      var id = (typeof x.id === "string" && /^[\w.\-]{1,40}$/.test(x.id) && !seen[x.id])
        ? x.id
        : Date.now() + "-" + Math.floor(Math.random() * 1000000);
      seen[id] = true;
      var e = { id: id, date: x.date, auftrag: x.auftrag.trim().slice(0, 40), stunden: round2(st) };
      if (x.typ === "urlaub" || x.typ === "krank") e.typ = x.typ;
      out.push(e);
    });
    var wochen = {};
    if (o.wochen && typeof o.wochen === "object") {
      Object.keys(o.wochen).forEach(function (k) { if (isKey(k) && o.wochen[k] === true) wochen[k] = true; });
    }
    var konto = null;
    var c = o.konto;
    if (c && typeof c === "object" && isKey(c.startDate) && isFinite(Number(c.startSaldo))) {
      konto = { startDate: c.startDate, startSaldo: round2(Number(c.startSaldo)), overrides: {} };
      if (c.overrides && typeof c.overrides === "object") {
        Object.keys(c.overrides).forEach(function (k) {
          var v = Number(c.overrides[k]);
          if (isKey(k) && isFinite(v)) konto.overrides[k] = round2(v);
        });
      }
    }
    var zeiten = {};
    if (o.zeiten && typeof o.zeiten === "object") {
      Object.keys(o.zeiten).forEach(function (k) {
        var z = o.zeiten[k];
        if (!isKey(k) || !z || typeof z !== "object") return;
        var tv = isTime(z.von) ? z.von : "";
        var tb = isTime(z.bis) ? z.bis : "";
        if (tv || tb) zeiten[k] = { von: tv, bis: tb };
      });
    }
    var ur = (typeof o.urlaubRest === "number" && isFinite(o.urlaubRest)) ? round2(o.urlaubRest) : null;
    return { eintraege: out, skipped: skipped, wochen: wochen, konto: konto, zeiten: zeiten, urlaubRest: ur };
  }

  importBtn.addEventListener("click", function () {
    importFile.value = "";
    importFile.click();
  });

  importFile.addEventListener("change", function () {
    var f = importFile.files && importFile.files[0];
    if (!f) return;
    if (f.size > 5 * 1024 * 1024) { setStatus("Die Datei ist zu groß für eine Sicherung."); return; }
    var rd = new FileReader();
    rd.onerror = function () { setStatus("Die Datei konnte nicht gelesen werden."); };
    rd.onload = function () {
      importFile.value = "";
      var data = null;
      try { data = sanitizeBackup(JSON.parse(rd.result)); } catch (e) { data = null; }
      if (!data) { setStatus("Diese Datei ist keine gültige Sicherung der Zeiterfassung."); return; }
      var n = data.eintraege.length;
      var msg = (n === 1 ? "1 Eintrag gefunden." : n + " Einträge gefunden.") +
        (data.skipped ? " " + data.skipped + " ungültige Einträge werden übersprungen." : "") +
        " Die aktuellen Daten in der App werden dadurch ersetzt. Fortfahren?";
      if (!window.confirm(msg)) { setStatus("Import abgebrochen."); return; }
      save(data.eintraege);
      saveWeeks(data.wochen);
      if (data.konto) { saveKonto(data.konto); } else { try { localStorage.removeItem(CKEY); } catch (e) {} }
      saveZeiten(data.zeiten);
      saveUrlaub(data.urlaubRest);
      resetForm();
      selected = today();
      renderAll();
      setStatus(n === 1 ? "1 Eintrag wurde importiert." : n + " Einträge wurden importiert.");
    };
    rd.readAsText(f);
  });

  /* ---------- Automatische Aktualisierung des Datums ---------- */
  function checkDay() {
    var now = today();
    if (now !== lastDay) {
      if (selected === lastDay) selected = now;
      renderAll();
    }
  }
  setInterval(checkDay, 60000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) checkDay(); });
  window.addEventListener("focus", checkDay);

  applyModus();
  renderAll();
})();
</script>
</body>
</html>
